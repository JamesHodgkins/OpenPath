[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/interop-mpp",
    "crates/interop-mspdi",
    "crates/schedule",
    "crates/store",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
chrono = "0.4"
thiserror = "2"
mpxj-rs = "=0.1.1"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
blake3 = "1"
byteorder = "1"
serde_json = "1"

[profile.release]
lto = "thin"
