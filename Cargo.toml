[workspace]
resolver = "2"
members = [
    "crates/openpath-core",
    "crates/openpath-schedule",
    "crates/openpath-files",
    "crates/openpath-mpp",
    "crates/openpath-mspdi",
    "crates/openpath-ui",
    "crates/openpath-app",
    "crates/openpath-cli",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
chrono = "0.4"
thiserror = "2"
mpxj-rs = "=0.1.1"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
blake3 = "1"
byteorder = "1"
serde_json = "1"
egui = "0.31"
eframe = "0.31"
openpath-core = { path = "crates/openpath-core" }
openpath-schedule = { path = "crates/openpath-schedule" }
openpath-files = { path = "crates/openpath-files" }
openpath-mspdi = { path = "crates/openpath-mspdi" }
openpath-ui = { path = "crates/openpath-ui" }

[profile.release]
lto = "thin"
